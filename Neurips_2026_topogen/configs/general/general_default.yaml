# General settings
name: 'topogen'      # Warning: 'debug' and 'test' are reserved name that have a special behavior

wandb: 'disabled'             # online | offline | disabled

resume: null            # If resume, path to ckpt file from outputs directory in main directory
test_only: null         # Use absolute path to checkpoint

check_val_every_n_epochs: 5
sample_every_val: 999999     # Disabled — val sampling not used for model selection; runs only at test time
val_check_interval: null

samples_to_generate: 512         # Graphs sampled during val (set to ~2x batch_size max)
samples_to_save: 20
chains_to_save: 1
log_every_steps: 50
number_chain_steps: 50

final_model_samples_to_generate: 100   # Graphs sampled at test time
final_model_samples_to_save: 30
final_model_chains_to_save: 20


memory_summary: False
faster_sampling: 1
