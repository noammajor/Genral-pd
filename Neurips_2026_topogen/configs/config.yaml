defaults:
    - _self_
    - general : general_default
    - dataset : planar
    - model   : construct       # only used by train_construct.py; harmless for other scripts
    - train   : train_default   # only used by train_construct.py; harmless for other scripts
    - optional construct_experiment: ???   # dataset-specific overrides; use +construct_experiment=<name>

hydra:
  job:
    chdir: True
  run:
    dir: runs/construct/${dataset.name}/${model.transition}/rev_proj=${model.rev_proj}/layers=${model.n_layers}
