# @package _global_
# ConStruct settings for Ego graphs
general:
    name: 'construct_ego'
    wandb: 'disabled'
    check_val_every_n_epochs: 300
    samples_to_generate: 151    # = val set size
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 151  # = test set size
    final_model_samples_to_save: 20
    final_model_chains_to_save: 10

train:
    n_epochs: 100000
    batch_size: 64

model:
    diffusion_steps: 500
    n_layers: 10
    hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256}
    rev_proj: False

dataset:
    name: ego
    datadir: 'data/ego'
    adaptive_loader: False
    fraction: 1.0
