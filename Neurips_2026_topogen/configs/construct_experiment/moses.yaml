# @package _global_
# ConStruct settings for MOSES (large molecular dataset)
# final_model_samples_to_generate=25000: mirrors DiGress eval protocol
general:
    name: 'construct_moses'
    wandb: 'disabled'
    check_val_every_n_epochs: 1
    samples_to_generate: 512
    samples_to_save: 20
    chains_to_save: 1
    final_model_samples_to_generate: 25000
    final_model_samples_to_save: 30
    final_model_chains_to_save: 20

train:
    n_epochs: 300
    batch_size: 256
    num_workers: 4

model:
    diffusion_steps: 500
    n_layers: 5
    hidden_mlp_dims: {'X': 256, 'E': 128, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 128, 'dim_ffy': 128}
    rev_proj: False

dataset:
    name: moses
    datadir: 'data/moses'
    filter: False
    adaptive_loader: False
    fraction: 1.0
